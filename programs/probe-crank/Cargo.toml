[package]
name = "probe-crank"
version = "0.1.0"
description = "Mission Control - Crank probe (recurring ER-scheduled task)"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "probe_crank"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "1.0.2", features = ["init-if-needed"] }
# Pinned to the same revision MagicBlock's own crank-counter example uses -
# the `crank` feature is not yet published to crates.io as of this snapshot.
ephemeral-rollups-sdk = { git = "https://github.com/magicblock-labs/ephemeral-rollups-sdk.git", rev = "0fc4604157de51df28693e02e5a1a6a4a08c8a03", features = [
    "anchor",
    "crank",
] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(target_os, values("solana"))',
] }
