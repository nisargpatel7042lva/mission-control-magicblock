[package]
name = "probe-oracle"
version = "0.1.0"
description = "Mission Control - Pricing Oracle probe (feed identity + freshness)"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "probe_oracle"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
custom-heap = []
custom-panic = []
anchor-debug = []

[dependencies]
anchor-lang = { version = "1.0.2", features = ["init-if-needed"] }
pyth-solana-receiver-sdk = "2.0.0"
