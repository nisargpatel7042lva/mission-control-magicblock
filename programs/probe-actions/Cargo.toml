[package]
name = "probe-actions"
version = "0.1.0"
description = "Mission Control - Magic Actions probe (post-commit base-layer effect)"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "probe_actions"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
custom-heap = []
custom-panic = []
anchor-debug = []

[dependencies]
anchor-lang = { version = "1.0.2", features = ["init-if-needed"] }
ephemeral-rollups-sdk = { version = "0.16.2", features = ["anchor"] }
